[package]
name = "tmuxxer"
version = "1.0.2"
edition = "2024"
rust-version = "1.85"
description = "⚡Tmux power tools — sessionizer & fzf. Ctrl+f Into everything!"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ptylabs/tmuxxer"
exclude = ["AGENTS.md"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.5"

[dev-dependencies]
proptest = "1.11.0"

[[bin]]
name = "tmuxxer"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
opt-level = "z"
